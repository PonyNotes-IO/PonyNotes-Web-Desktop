  # redis 配置
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password:
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 阿里云短信服务配置
aliyun:
  sms:
    access-key-id: 1      
    access-key-secret: 1  
    sign-name: '北京爱欧爱科技'          # 短信签名（需审核通过）
    template-code: SMS_321490942 # 短信模板ID（如：SMS_123456789）
    expire-minutes: 5                     # 验证码过期时间（分钟）

# 验证码通用配置
verify:
  subject: "验证码验证"
  code:
    length: 6                     # 验证码长度（默认6位）
    expire-minutes: 5                     # 验证码过期时间（默认5分钟）
    redis-key-prefix:
      sms: "verify:sms:"          # 短信验证码Redis Key前缀（最终Key：verify:sms:13800138000）
      email: "verify:email:"      # 邮箱验证码Redis Key前缀（最终Key：verify:email:test@qq.com）

