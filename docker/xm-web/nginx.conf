# configuration file /etc/nginx/sites-enabled/xmweb.conf:

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 8085;
        server_name xiaomabiji.com www.xiaomabiji.com;

        location / {
            root /opt/www/dist;
            index index.html;
        }
        location /mobile/ {
            root /opt/www/dist;
            index mobile.html;
            try_files $uri $uri/ @routermobile;
        }
        location /prod-api/ {
            rewrite ^/prod-api/(.*)$  /$1 break;
            proxy_set_header   Remote_Addr        $remote_addr;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            client_max_body_size    1g;
            proxy_pass http://host.docker.internal:8080;
            break;
       }
        location @routermobile {
            rewrite ^.*$ /mobile.html last;
        }
    }

    server {
        listen 8090;
        server_name manager.xiaomabiji.com;

        location / {
            root /opt/manager/dist;
            index index.html;
            try_files $uri $uri/ @router;
        }
        location /prod-api/ {
            rewrite ^/prod-api/(.*)$  /$1 break;
            proxy_set_header   Remote_Addr        $remote_addr;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_pass http://host.docker.internal:8080;
        }

        location @router {
            rewrite ^.*$ /index.html last;
        }
    }
}


