# configuration file /etc/nginx/sites-enabled/xmweb.conf:

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    resolver 127.0.0.11 valid=10s;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 8085;
        server_name xiaomabiji.com www.xiaomabiji.com;

        location / {
            root /opt/www/www/dist;
            index index.html;
        }
        location /mobile/ {
            root /opt/www/www/dist;
            index mobile.html;
            try_files $uri $uri/ @routermobile;
        }
        location /prod-api/ {
            rewrite ^/prod-api/(.*)$  /$1 break;
            proxy_set_header   Remote_Addr        $remote_addr;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            client_max_body_size    1g;
            proxy_pass http://host.docker.internal:8080;
            break;
       }
        location @routermobile {
            rewrite ^.*$ /mobile.html last;
        }
    }

    server {
        listen 8090;
        server_name manager.xiaomabiji.com;

        location / {
            root /opt/www/manager/dist;
            index index.html;
            try_files $uri $uri/ @router;
        }
        location /prod-api/ {
            rewrite ^/prod-api/(.*)$  /$1 break;
            proxy_set_header   Remote_Addr        $remote_addr;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_pass http://host.docker.internal:8080;
        }

        location @router {
            rewrite ^.*$ /index.html last;
        }
    }

    server {
        listen 8095;
        server_name web.xiaomabiji.com;
        underscores_in_headers on;
        set $appflowy_cloud_backend "http://appflowy_cloud:8000";
        set $gotrue_backend "http://gotrue:9999";

        location / {
            root /opt/www/web/dist;
            index index.html;
            try_files $uri $uri/ @router;
        }
        # GoTrue
        location /gotrue/ {
            proxy_pass $gotrue_backend;

            rewrite ^/gotrue(/.*)$ $1 break;
            # Allow headers like redirect_to to be handed over to the gotrue
            # for correct redirecting
            proxy_set_header Host $http_host;
            proxy_pass_request_headers on;
        }

        # WebSocket
        location /ws {
            # Existing proxy configuration
            proxy_pass $appflowy_cloud_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        location /api {
            proxy_pass $appflowy_cloud_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $http_host;


            location ~* ^/api/workspace/([a-zA-Z0-9_-]+)/publish$ {
                proxy_pass $appflowy_cloud_backend;
                proxy_request_buffering off;
                client_max_body_size 256M;
            }

            # AppFlowy-Cloud
            location /api/chat {
                proxy_pass $appflowy_cloud_backend;

                proxy_http_version 1.1;
                proxy_set_header Connection "";
                chunked_transfer_encoding on;
                proxy_buffering off;
                proxy_cache off;

                proxy_read_timeout 600s;
                proxy_connect_timeout 600s;
                proxy_send_timeout 600s;
            }

            location /api/import {
                proxy_pass $appflowy_cloud_backend;

                # Set headers
                proxy_set_header X-Request-Id $request_id;
                proxy_set_header Host $http_host;

                # Timeouts
                proxy_read_timeout 600s;
                proxy_connect_timeout 600s;
                proxy_send_timeout 600s;

                # Disable buffering for large file uploads
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_cache off;
                client_max_body_size 2G;
            }
        }
        location @router {
            rewrite ^.*$ /index.html last;
        }
    }
}


